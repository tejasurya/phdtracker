name: Update PhD data

on:
  schedule:
    - cron: "17 */4 * * *"        # every 4 hours (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also run the Wayback Machine backfill (slow, one-off)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["data/tracker.xlsx", "crawler/**"]

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt

      - name: Excel → JSON
        run: python crawler/excel_to_json.py

      - name: Crawl sources
        if: github.event_name != 'push'          # an Excel upload only needs the conversion
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python crawler/crawl.py

      - name: Wayback backfill
        if: github.event_name == 'workflow_dispatch' && inputs.backfill
        run: python crawler/backfill_wayback.py

      - name: Commit data
        run: |
          git config user.name  "phdboard-bot"
          git config user.email "phdboard-bot@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
